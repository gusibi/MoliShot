<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">MoliShot app icon</title>
  <desc id="desc">Glossy soft-coral squircle, cream capture card, white motion bars.</desc>

  <defs>
    <!-- Base squircle gradient: soft warm orange-coral -->
    <radialGradient id="bgGloss" cx="35%" cy="30%" r="75%" fx="30%" fy="25%">
      <stop offset="0%" stop-color="#FFB088"/>
      <stop offset="100%" stop-color="#F07855"/>
    </radialGradient>

    <!-- Specular highlight for the gloss effect -->
    <radialGradient id="glossHighlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle inner shadow / edge darkening -->
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.12"/>
    </radialGradient>

    <!-- Right block top gradient: white with subtle warmth -->
    <linearGradient id="blockTopGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F0E8"/>
    </linearGradient>

    <!-- Right block bottom gradient: white with subtle warmth -->
    <linearGradient id="blockBotGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCFAF5"/>
      <stop offset="100%" stop-color="#F0EBE0"/>
    </linearGradient>

    <!-- Cream card subtle shadow -->
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.08"/>
    </filter>

    <!-- Clip path for the squircle -->
    <clipPath id="squircle">
      <rect width="1024" height="1024" rx="230"/>
    </clipPath>
  </defs>

  <!-- Base squircle with glossy gradient -->
  <rect width="1024" height="1024" rx="230" fill="url(#bgGloss)"/>

  <!-- Specular gloss highlight — large ellipse near the top -->
  <g clip-path="url(#squircle)">
    <ellipse cx="400" cy="180" rx="520" ry="340" fill="url(#glossHighlight)"/>
  </g>

  <!-- Subtle edge darkening for depth -->
  <rect width="1024" height="1024" rx="230" fill="url(#innerGlow)"/>

  <!-- Left cream capture card -->
  <rect x="88" y="152" width="548" height="720" rx="76" fill="#F7F4EF" filter="url(#cardShadow)"/>

  <!-- Subtle inner border on the card for depth -->
  <rect x="88" y="152" width="548" height="720" rx="76" fill="none" stroke="#E8E2D6" stroke-width="2"/>

  <!-- Right top block: warm terracotta -->
  <rect x="688" y="268" width="248" height="168" rx="84" fill="url(#blockTopGrad)"/>

  <!-- Right bottom block: deeper warm terracotta -->
  <rect x="688" y="508" width="312" height="168" rx="84" fill="url(#blockBotGrad)"/>
</svg>
