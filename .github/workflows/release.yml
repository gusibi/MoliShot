name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    # Liquid Glass (NSGlassEffectView / SwiftUI.glassEffect) needs the
    # macOS 26 SDK — Xcode 16 on macos-15 runners cannot compile it.
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build archive
        # Ad-hoc signed (CODE_SIGN_IDENTITY="-"): the bundle gets a real,
        # validating signature. macOS 26 TCC refuses to persist Screen
        # Recording grants for unsigned/linker-signed bundles — the user
        # grants the toggle and the system keeps asking. Ad-hoc is not
        # notarized (Gatekeeper still warns on first open), but TCC can pin
        # the grant to the bundle's cdhash for the life of that build.
        run: |
          xcodebuild archive \
            -project MoliShot.xcodeproj \
            -scheme MoliShot \
            -archivePath ./build/MoliShot.xcarchive \
            -configuration Release \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=""

      - name: Package DMG
        run: |
          APP_PATH="./build/MoliShot.xcarchive/Products/Applications/MoliShot.app"
          DMG_NAME="MoliShot-${GITHUB_REF##*/}.dmg"
          DMG_PATH="./build/$DMG_NAME"

          mkdir -p ./build/dmg
          cp -R "$APP_PATH" ./build/dmg/

          hdiutil create \
            -volname "MoliShot" \
            -srcfolder ./build/dmg \
            -ov \
            -format UDZO \
            "$DMG_PATH"

          echo "DMG_PATH=$DMG_PATH" >> $GITHUB_ENV
          echo "DMG_NAME=$DMG_NAME" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./build/MoliShot-*.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
